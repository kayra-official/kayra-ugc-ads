app:
  name: KAYRA AI VIDEO GENERATOR
  output_dir: output
  input_dir: input
  temp_dir: temp
  logs_dir: logs

video:
  width: 1080
  height: 1920
  fps: 24
  target_seconds: 28
  scene_count: 3
  scene_seconds: 7
  outro_seconds: 2
  clip_segment_seconds: 7
  crf: 19
  preset: medium
  music_volume: 0.22
  audio_fade_seconds: 1.5
  product_speed: 0.45
  product_clip_duration_seconds: 10

audio:
  background_music: "assets/music/background.mp3"

branding:
  outro_video: "assets/branding/kayra_logo.mp4"
  
storyboard:
  style: "Premium Brazilian jewellery UGC; photorealistic, emerald green, warm brown and gold; natural movement; cinematic macro detail; refined luxury lifestyle."
  language: "Portuguese (Brazil)"
  model_consistency: true

generation:
  backend: "ltx_mlx_hybrid"
  ltx_project_dir: "~/Documents/GitHub/ltx-2-mlx"
  model: "dgrauet/ltx-2.3-mlx-q4"
  render_width: 256
  render_height: 448
  frames: 89
  # Model video scenes use the original supplied model-with-jewellery image.
  snapshot_image_strength: 0.65
  product_segmenter_model: "u2net"
  comfyui_url: "http://127.0.0.1:8188"
  comfyui_product_workflow: "assets/workflows/product_snapshot_api.json"
  # Set these to node IDs from the exported API workflow JSON.
  comfyui_image_node_id: ""
  comfyui_image_input: "image"
  comfyui_prompt_node_id: "3"
  comfyui_output_node_id: "7"
  comfyui_prompt_input: "text"
  comfyui_timeout_seconds: 3600
  distilled: true
  low_ram: true
  no_audio: true
  seed_base: 20261107
  command_timeout_seconds: 3600
  batch_size: 1
  retries: 1
  require_video_backend: true
  max_scenes_per_run: 8
  negative_prompt: "jewellery, necklace, pendant, earrings, ring, bracelet, gemstones, text, letters, words, subtitles, captions, watermark, logo, graphic overlay, deformed hands, extra fingers, duplicated objects"
  command: "python scripts/ltx_mlx_wrapper.py"

analysis:
  backend: "local"
  ollama_url: "http://127.0.0.1:11434"
  ollama_model: "llava:7b"
  timeout_seconds: 180

assets:
  logo: "assets/logo/KAYRA_LOGO.jpeg"
  music_dir: "assets/music"
  music_file: ""  # blank = first supported local music file

preparation_workers: 2
ltx_workers: 1
